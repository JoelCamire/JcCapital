<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
